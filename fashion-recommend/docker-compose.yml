version: '3'

# 日志轮转上限。Gorse master 在 item-to-item 的 column 表达式写错时，每个任务
# 周期会给 383,460 个 item 各写一行错误日志，每小时一轮，写了好几天，最后把
# Docker VM 的磁盘写满 —— 表现是 master 退出码 2、docker logs 直接卡死、
# 连 docker rmi 都清不动。json-file 驱动默认无上限，所以这不是假想的风险。
#
# 注意 docker system df 不把日志算进 Containers 的 SIZE 列，所以磁盘满了以后
# 从 df 上完全看不出来是日志的问题。
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:15
    container_name: fashion-postgres
    logging: *default-logging
    environment:
      POSTGRES_DB: gorse
      POSTGRES_USER: gorse
      POSTGRES_PASSWORD: gorse_pass
    # port 5432 not exposed to host — local Postgres is already on :5432.
    # Gorse containers connect via Docker internal network (hostname "postgres").
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gorse"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存（使用 Redis Stack 支持 RediSearch）
  #
  # maxmemory 是这里唯一真正重要的护栏。原来跑的是原厂默认 maxmemory=0，
  # 也就是**无上限**：master 批量写邻居数据时 Redis 一路涨到被内核 SIGKILL
  # （退出码 137）。对一个只存派生数据的缓存来说，正确的失败模式是**驱逐**
  # 而不是死亡 —— 降级，不是宕机。
  #
  # 压垮它的是 BGSAVE 的 fork：写时复制的开销趋近于再复制一份数据集，
  # 实测 CoW 峰值 741 MB → 977 MB 且还在涨，而快照耗时 66s → 180s、
  # 两次快照间隔却始终是 61s（`save 60 10000` 在持续写入下每分钟必触发）。
  # 快照变慢的速度超过了间隔 = 死亡螺旋。mem_limit 留了 2g 给这个 fork 峰值。
  #
  # ⚠️ 驱逐策略是给**服务**用的，不是给**批量构建**用的。批量任务在写整个缓存
  #    时，LRU 会把刚写进去的东西淘汰掉 —— 工作集一旦超过 maxmemory，这个构建
  #    **永远不会收敛**，而且全程不报一个错。第一次设 maxmemory=1gb 就撞上了：
  #    evicted_keys 直接到 24 万，等于邻居数据写进去多少扔掉多少。
  #
  #    所以 allkeys-lru 只是兜底（服务期降级好过宕机），真正的要求是
  #    **maxmemory 大到装得下整个工作集**，并且构建完必须验证：
  #      docker exec fashion-redis redis-cli INFO stats | grep evicted_keys
  #    不为 0 的那次 eval 结果作废 —— 驱逐会安静地压低指标，不报错。
  #
  # ⚠️ 批量导入期间临时关掉快照，别永久关（Redis 里的东西虽然都能从 Postgres
  #    重算，但实测要几十分钟）：
  #      redis-cli CONFIG SET save ""      # 批量前
  #      redis-cli CONFIG SET save "900 1" && redis-cli BGSAVE   # 批量后
  # 实测（2026-08-30，Load Dataset 期间采样）：
  #   master 峰值 1,110 MiB   ← 注意：曾经看到的 2.4 GiB 是它在 Redis 已死、
  #                              空转重试时的状态，不是正常工作负载
  #   redis  顶满当时的 2 GiB 上限，且 evicted_keys 已到 24 万
  # VM 共 7.75 GiB，停掉 rag 那套后总占用约 4 GiB —— 所以 Redis 的瓶颈是
  # 上限设小了，不是内存不够。
  redis:
    image: redis/redis-stack-server:latest
    container_name: fashion-redis
    logging: *default-logging
    mem_limit: 4500m
    environment:
      REDIS_ARGS: "--maxmemory 3500mb --maxmemory-policy allkeys-lru"
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Gorse Master 节点
  #
  # 故意**不设** mem_limit。稳态实测 2.46 GiB，但 Load Dataset 的峰值没测过，
  # 上限设低了只会把「Redis 被杀」换成「master 被杀」—— 制造一个新的失败模式，
  # 而不是消除旧的。要设的话先测峰值：
  #   docker stats --no-stream fashion-gorse-master   # 在 Load Dataset 运行期间采样
  # 在此之前靠「跑批量任务时停掉 rag-service 那套」来保证余量：
  #   docker compose stop milvus kafka minio etcd     # 约 650 MB + Kafka 的 CPU
  # 它们的状态都在卷里，来回切换无损。
  gorse-master:
    image: zhenghaoz/gorse-master:latest
    container_name: fashion-gorse-master
    logging: *default-logging
    ports:
      - "8086:8086"
      - "8088:8088"
    volumes:
      - ./config/config.toml:/etc/gorse/config.toml
      - gorse_data:/var/lib/gorse
    command: --config /etc/gorse/config.toml
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Gorse Server 节点
  gorse-server:
    image: zhenghaoz/gorse-server:latest
    container_name: fashion-gorse-server
    logging: *default-logging
    ports:
      - "8087:8087"
    command: 
      - --master-host=gorse-master
      - --master-port=8086
      - --http-host=0.0.0.0
      - --http-port=8087
    depends_on:
      - gorse-master
    restart: unless-stopped

  # Gorse Worker 节点
  gorse-worker:
    image: zhenghaoz/gorse-worker:latest
    container_name: fashion-gorse-worker
    logging: *default-logging
    command:
      - --master-host=gorse-master
      - --master-port=8086
      - --jobs=4
    depends_on:
      - gorse-master
    restart: unless-stopped

  # Milvus dependencies
  etcd:
    image: quay.io/coreos/etcd:v3.5.14
    container_name: fashion-milvus-etcd
    logging: *default-logging
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - etcd_data:/etcd
    command: >
      etcd
      --advertise-client-urls=http://etcd:2379
      --listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    image: minio/minio:RELEASE.2023-03-13T19-46-17Z
    container_name: fashion-milvus-minio
    logging: *default-logging
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Kafka broker (KRaft mode — no Zookeeper required)
  # Used only for rag-service POST /ingest streaming path.
  # POST /query does not need Kafka.
  #
  # Dual-listener setup:
  #   EXTERNAL (port 9092) — host processes connect here (uvicorn running on your Mac)
  #   INTERNAL (port 9093) — Docker containers connect here (future containerised rag-service)
  #   CONTROLLER (port 9094) — KRaft leader election, internal only, never exposed
  #
  # Each listener advertises a different address back to clients (step 2 of the
  # Kafka handshake). EXTERNAL advertises localhost:9092; INTERNAL advertises
  # kafka:9093. Without this split, a container would get told "connect to
  # localhost:9092", look at its own loopback, find nothing, and fail.
  kafka:
    image: bitnamilegacy/kafka:3.7
    container_name: fashion-kafka
    logging: *default-logging
    ports:
      - "9092:9092" # EXTERNAL — host processes
      - "9093:9093" # INTERNAL — Docker containers (exposed so host can verify)
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_LISTENERS: EXTERNAL://:9092,INTERNAL://:9093,CONTROLLER://:9094
      KAFKA_CFG_ADVERTISED_LISTENERS: EXTERNAL://localhost:9092,INTERNAL://kafka:9093
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9094
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
    volumes:
      - kafka_data:/bitnami/kafka
    healthcheck:
      test: [ "CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list" ]
      interval: 15s
      timeout: 10s
      retries: 5

  # Milvus vector store — used by rag-service for HNSW semantic search
  milvus:
    image: milvusdb/milvus:v2.4.0
    container_name: fashion-milvus
    logging: *default-logging
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  gorse_data:
  etcd_data:
  minio_data:
  milvus_data:
  kafka_data:
